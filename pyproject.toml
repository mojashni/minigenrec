[project]
name = "minigenrec"
version = "0.1.0"
description = "MiniGenRec: LLM-native ranking inspired by Netflix GenRec (MovieLens 1M)"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "transformers>=4.44",
  "peft>=0.12",
  "pandas>=2.2",
  "numpy>=1.26",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "pytest>=8.0",
]

[project.scripts]
minigenrec-train = "train:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minigenrec"]
